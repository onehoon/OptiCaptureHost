name: build

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/third_party/ffx | Out-Null
          Copy-Item build/Release/OptiCaptureHost.exe package/
          Copy-Item build/Release/OptiCaptureLauncher.exe package/
          Copy-Item README.md package/
          Copy-Item LICENSE package/
          Copy-Item NOTICE.md package/
          Copy-Item third_party/ffx/LICENSE.txt package/third_party/ffx/
          Compress-Archive -Path package/* -DestinationPath OptiCaptureHost-win64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: OptiCaptureHost-win64
          path: OptiCaptureHost-win64.zip
